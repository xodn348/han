[package]
name = "han"
version = "0.2.0"
edition = "2024"
description = "한글(Han) Korean-syntax programming language: interpreter, LLVM-IR codegen, and LSP"
license = "MIT"
repository = "https://github.com/vkehfdl1/han"
authors = ["Junhyuk Lee <xodn348@tamu.edu>"]
keywords = ["korean", "language", "compiler", "interpreter", "llvm"]
categories = ["compilers", "development-tools", "command-line-utilities"]

[[bin]]
name = "hgl"
path = "src/main.rs"

[lib]
name = "han"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["native"]
native = ["reqwest", "python"]
python = ["pyo3"]

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["wasmbind"] }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
pyo3 = { version = "0.24", features = ["auto-initialize"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
insta = "1.39"

[[bench]]
name = "parser_speed"
harness = false

[[bench]]
name = "interpret_speed"
harness = false
